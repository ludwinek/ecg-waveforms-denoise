# Experiment protocol v0.1 (frozen before running on real data)
seed: 20261008
fs: 360
segment_seconds: 300        # per record
warmup_seconds: 10          # excluded from metrics (adaptive filter convergence)
snr_in_db: [0, 5, 10, 20]
noise_types: [bw, em, ma, pli]   # bw/em/ma = NSTDB (real), pli = extended synthetic
excluded_records: ["102", "104", "107", "217"]   # paced rhythms
records_all: ["100","101","102","103","104","105","106","107","108","109",
              "111","112","113","114","115","116","117","118","119",
              "121","122","123","124",
              "200","201","202","203","205","207","208","209","210",
              "212","213","214","215","217","219","220","221","222","223",
              "228","230","231","232","233","234"]
n_dev: 8
n_folds: 4
channel_name: MLII
nstdb:
  train_seconds: [0, 1200]     # noise used for DL training
  test_seconds: [1200, 1800]   # noise used for evaluation
pli:
  f0: 50.0
  harmonic_amp: 0.2            # 150 Hz relative amplitude
  freq_drift_hz: 0.2
  am_depth: 0.2
oracle_reference:
  snr_ref_db: 10
metrics:
  remove_dc: true
reference:
  mode: spline_hp     # DECIDED (v0.7): spline_hp main; highpass + raw = sensitivity/reporting; spline = sensitivity
  pr_offset_s: 0.08
  spline_hp_cutoff_hz: 0.3
  highpass_cutoff_hz: 0.5
